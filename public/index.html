  <!--  -->
  <div id="search-area">
    <h1>Listing Search</h1>
    <form id="form">
      <label>Min price <input name="minPrice" type="number" /></label>
      <label>Max price <input name="maxPrice" type="number" /></label>
      <label>Min bedrooms <input name="minBedrooms" type="number" /></label>
      <label>City <input name="city" /></label>
      <label>Keyword <input name="keyword" /></label>
      <label>Target budget <input name="targetBudget" type="number" /></label>
      <div>
        <button type="submit">Search</button>
        <button type="button" id="clear">Clear</button>
      </div>
    </form>

    <div id="status"></div>
    <div id="results"></div>
    <div id="pager" hidden>
      <button id="prev">Prev</button>
      <span id="pageInfo"></span>
      <button id="next">Next</button>
    </div>
  </div>

<script>
  const form = document.getElementById("form");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const pager = document.getElementById("pager");
  let page = 1, query = {};

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function load() {
    statusEl.textContent = "Loading…";
    statusEl.className = "";
    const params = new URLSearchParams({ ...query, page });
    try {
      const r = await fetch("/api/listings?" + params);
      const type = r.headers.get("content-type") || "";
      if (!type.includes("application/json")) {
        throw new Error(`Server is offline or unreachable (HTTP ${r.status}).`);
      }
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      render(data);
    } catch (e) {
      resultsEl.innerHTML = "";
      pager.hidden = true;
      statusEl.className = "error";
      statusEl.textContent = "Error: " + (e instanceof TypeError ? "Could not connect to server." : e.message);
    }
  }

  function render(data) {
    statusEl.textContent = `${data.total} result(s)`;
    if (data.total === 0) {
      statusEl.textContent = "No results.";
      resultsEl.innerHTML = "";
      pager.hidden = true;
      return;
    }
    resultsEl.innerHTML = `<table>
      <thead><tr><th>Address</th><th>City</th><th>Price</th><th>Bedrooms</th><th>Listed</th><th>Score</th></tr></thead>
      <tbody>${data.results.map((l) => `<tr>
        <td>${esc(l.address)}</td><td>${esc(l.city)}</td>
        <td>$${Number(l.price).toLocaleString()}</td><td>${l.bedrooms}</td>
        <td>${esc(String(l.listedDate).slice(0, 10))}</td><td>${l.score.toFixed(3)}</td></tr>`).join("")}
      </tbody></table>`;
    pager.hidden = false;
    document.getElementById("pageInfo").textContent = ` Page ${data.page} of ${data.totalPages} `;
    document.getElementById("prev").disabled = data.page <= 1;
    document.getElementById("next").disabled = data.page >= data.totalPages;
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    query = Object.fromEntries([...new FormData(form)].filter(([, v]) => v !== ""));
    page = 1;
    load();
  });
  document.getElementById("clear").onclick = () => { form.reset(); query = {}; page = 1; load(); };
  document.getElementById("prev").onclick = () => { page--; load(); };
  document.getElementById("next").onclick = () => { page++; load(); };

  load();
</script>
